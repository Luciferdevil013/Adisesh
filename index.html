  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    .bc-page {
      min-height: 100vh;
      width: 100%;
      margin: 0;
      padding: 30px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at top, #202c55 0%, transparent 48%),
        radial-gradient(ellipse at bottom, #32134f 0%, transparent 48%),
        #070910;
    }

    .bc-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 32px 24px 25px;
      position: relative;
      z-index: 2;
      border: 1px solid rgba(111, 164, 255, .28);
      border-radius: 26px;
      background: rgba(13, 18, 34, .88);
      box-shadow: 0 0 45px rgba(65, 106, 255, .16);
      backdrop-filter: blur(12px);
    }

    .bc-logo {
      width: 145px;
      height: 145px;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      margin: 0 auto 23px;
      border: 3px solid #65c8ff;
      box-shadow: 0 0 28px rgba(59, 177, 255, .35);
    }

    .bc-name {
      margin: 0 0 12px;
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 900;
      letter-spacing: 1px;
      overflow-wrap: anywhere;
      background: linear-gradient(90deg, #fff, #79d8ff, #b6a0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .bc-subtitle {
      color: #c5cede;
      font-size: 14px;
      line-height: 1.7;
      margin: 0 auto 25px;
    }

    .bc-join {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 78px;
      padding: 18px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, .55);
      color: #07111c !important;
      text-decoration: none !important;
      font-size: clamp(20px, 6vw, 24px);
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(100deg, #3fe0ff, #7f9cff);
      box-shadow: 0 0 34px rgba(67, 187, 255, .55);
      transition: transform .2s, box-shadow .2s;
      animation: bcPulse 1.6s ease-in-out infinite;
    }

    .bc-join:hover {
      animation: none;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 46px rgba(67, 187, 255, .8);
    }

    @keyframes bcPulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 26px rgba(67, 187, 255, .45);
      }

      50% {
        transform: scale(1.04);
        box-shadow: 0 0 48px rgba(67, 187, 255, .85);
      }
    }

    .bc-status {
      margin: 16px 0 0;
      color: #9caec5;
      font-size: 11px;
      letter-spacing: 1.5px;
    }

    .bc-star {
      position: absolute;
      color: #7edbff;
      opacity: .6;
      animation: bcFloat 4s ease-in-out infinite;
      pointer-events: none;
    }

    .bc-star:nth-child(1) {
      top: 12%;
      left: 12%;
      font-size: 22px;
    }

    .bc-star:nth-child(2) {
      top: 25%;
      right: 10%;
      font-size: 15px;
      animation-delay: 1s;
    }

    .bc-star:nth-child(3) {
      bottom: 15%;
      left: 15%;
      font-size: 18px;
      animation-delay: 2s;
    }

    @keyframes bcFloat {

      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      50% {
        transform: translateY(-12px) rotate(18deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bc-star {
        animation: none;
      }

      .bc-join {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>
